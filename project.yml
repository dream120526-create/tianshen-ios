name: TianShen
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGN_ENTITLEMENTS: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  TianShen:
    type: application
    platform: iOS
    sources:
      - path: TianShen
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.tianshen
        PRODUCT_NAME: TianShen
        INFOPLIST_FILE: TianShen/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OBJC_BRIDGING_HEADER: TianShen/Detection/TianShen-Bridging-Header.h
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(PROJECT_DIR)/Vendor"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lz"
          - "-lc++"

    dependencies:
      # 官方 onnxruntime 静态 framework（1.24.2），已 vendor 进仓库，构建不联网
      - framework: Vendor/onnxruntime.framework
        embed: false
      - sdk: CoreML.framework
      - sdk: Accelerate.framework

schemes:
  TianShen:
    build:
      targets:
        TianShen: all
    run:
      config: Debug
    archive:
      config: Release
